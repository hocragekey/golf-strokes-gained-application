name: Deploy web

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment and stack suffix (dev or prod)
        type: string
        required: true
      ref:
        description: Git ref to build and deploy
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> AWS STS; no stored AWS keys
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.stack.outputs.url }}
    concurrency:
      group: deploy-web-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      STACK_NAME: golf-sg-web-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @golf-sg/web build

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy infrastructure
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          EXECUTION_ROLE_ARN: ${{ vars.AWS_CFN_EXECUTION_ROLE_ARN }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          ACM_CERTIFICATE_ARN: ${{ vars.ACM_CERTIFICATE_ARN }}
          HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file infra/cloudformation/web.yml \
            --role-arn "$EXECUTION_ROLE_ARN" \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "Environment=$ENVIRONMENT" \
              "DomainName=$DOMAIN_NAME" \
              "AcmCertificateArn=$ACM_CERTIFICATE_ARN" \
              "HostedZoneId=$HOSTED_ZONE_ID" \
            --tags app=golf-sg "environment=$ENVIRONMENT"

      - id: stack
        name: Read stack outputs
        run: |
          out() {
            aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          {
            echo "bucket=$(out BucketName)"
            echo "distribution=$(out DistributionId)"
            echo "url=$(out SiteUrl)"
          } >> "$GITHUB_OUTPUT"

      # Hashed files are immutable and kept, so clients still on the previous build keep working.
      # Everything else (app shell, service worker, manifest, icons) must revalidate.
      - name: Upload site
        working-directory: apps/web/dist
        env:
          BUCKET: ${{ steps.stack.outputs.bucket }}
        run: |
          aws s3 sync . "s3://$BUCKET" --exclude '*' --include 'assets/*' --include 'workbox-*.js' \
            --cache-control 'public, max-age=31536000, immutable'
          aws s3 sync . "s3://$BUCKET" --delete --exclude 'assets/*' --exclude 'workbox-*.js' \
            --cache-control 'no-cache'

      - name: Invalidate CDN
        env:
          DISTRIBUTION: ${{ steps.stack.outputs.distribution }}
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" \
            --paths '/*' --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$id"

      - name: Smoke test
        env:
          URL: ${{ steps.stack.outputs.url }}
        run: |
          curl -fsS --retry 5 --retry-all-errors "$URL/" | grep -q '<title>Golf Strokes Gained</title>'
          curl -fsS "$URL/rounds/new" | grep -q 'id="root"'
          curl -fsSI "$URL/sw.js" | grep -qi '^content-security-policy:'
