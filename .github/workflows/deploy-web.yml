name: Deploy web and sync API

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment and stack suffix (prod)
        type: string
        required: true
      artifact:
        description: Build artifact from build-release.yml
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> AWS STS; no stored AWS keys
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-web-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: apps
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: deploy
        uses: ./.github/actions/deploy-env
        with:
          environment: ${{ inputs.environment }}
          execution-role-arn: ${{ vars.AWS_CFN_EXECUTION_ROLE_ARN }}
          domain-name: ${{ vars.DOMAIN_NAME }}
          acm-certificate-arn: ${{ vars.ACM_CERTIFICATE_ARN }}
          hosted-zone-id: ${{ vars.HOSTED_ZONE_ID }}
