name: Build release

# Builds the web app and the sync Lambda once. The same artifact is tested in the throwaway test
# environment and then promoted to prod, so prod never runs an untested build.
on:
  workflow_call:
    outputs:
      artifact:
        description: Name of the uploaded build artifact
        value: ${{ jobs.build.outputs.artifact }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @golf-sg/web build
      - name: Build sync API bundle
        run: |
          pnpm --filter @golf-sg/sync build
          (cd apps/sync/dist && zip -q -X ../sync.zip index.mjs index.mjs.map)
      - id: name
        env:
          SHA: ${{ github.sha }}
        run: echo "artifact=release-$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: |
            apps/web/dist/
            apps/sync/sync.zip
          if-no-files-found: error
          retention-days: 90
