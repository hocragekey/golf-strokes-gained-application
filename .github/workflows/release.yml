name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Concurrency is per job, not per workflow: a prod deploy waiting for approval must not hold up
# release-please or dev deploys from later pushes. deploy-web.yml serializes each environment.
jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # AWS deploys stay off until the account is bootstrapped (docs/deploy-aws.md).
  deploy-dev:
    name: Deploy dev
    if: vars.AWS_DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-web.yml
    with:
      environment: dev
      ref: ${{ github.sha }}

  deploy-prod:
    name: Deploy prod
    needs: [release-please, deploy-dev]
    if: needs.release-please.outputs.released == 'true' && vars.AWS_DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-web.yml
    with:
      environment: prod
      ref: ${{ needs.release-please.outputs.tag }}
