name: Test environment

# Creates the whole test environment from scratch (CDN, site, sync API, database), runs the
# Playwright suite against it over HTTPS, then deletes every resource, pass or fail. Only one run
# holds the environment at a time; a newer run waits, and GitHub drops older waiting runs.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref the build came from
        type: string
        required: true
      artifact:
        description: Build artifact from build-release.yml
        type: string
        required: true

permissions:
  contents: read

jobs:
  test:
    name: Deploy, test, tear down
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> AWS STS; no stored AWS keys
    environment:
      name: test
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: test-environment
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: apps
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      # A crashed earlier run may have left resources behind.
      - name: Clear leftovers
        env:
          EXECUTION_ROLE_ARN: ${{ vars.AWS_CFN_EXECUTION_ROLE_ARN }}
        run: ./scripts/teardown-env.sh test
      - id: deploy
        uses: ./.github/actions/deploy-env
        with:
          environment: test
          execution-role-arn: ${{ vars.AWS_CFN_EXECUTION_ROLE_ARN }}
          domain-name: ${{ vars.DOMAIN_NAME }}
          acm-certificate-arn: ${{ vars.ACM_CERTIFICATE_ARN }}
          hosted-zone-id: ${{ vars.HOSTED_ZONE_ID }}
      - name: Playwright against the test environment
        env:
          E2E_BASE_URL: ${{ steps.deploy.outputs.url }}
        run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-test-env
          path: playwright-report/
          retention-days: 14
      # Deploys can outlast the first STS session, so refresh it before deleting anything.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: always()
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Tear down
        if: always()
        env:
          EXECUTION_ROLE_ARN: ${{ vars.AWS_CFN_EXECUTION_ROLE_ARN }}
        run: ./scripts/teardown-env.sh test
