name: Deploy environment
description: >-
  Deploys a prebuilt release (apps/web/dist and apps/sync/sync.zip) to one environment: the sync
  API stack, the web stack, the site files and a CDN invalidation, then smoke-tests the result.
  Expects AWS credentials for that environment's deploy role.

inputs:
  environment:
    description: Environment and stack suffix (test or prod)
    required: true
  execution-role-arn:
    description: CloudFormation execution role for this environment
    required: true
  domain-name:
    description: Custom hostname (optional)
    default: ''
  acm-certificate-arn:
    description: us-east-1 certificate covering domain-name (required with domain-name)
    default: ''
  hosted-zone-id:
    description: Route 53 zone for domain-name (optional)
    default: ''

outputs:
  url:
    description: Site URL
    value: ${{ steps.stack.outputs.url }}

runs:
  using: composite
  steps:
    - id: config
      name: Read app config
      shell: bash
      run: |
        echo "google_client_id=$(jq -r '.googleClientId // ""' config/app.json)" >> "$GITHUB_OUTPUT"
        echo "card_scan_model_id=$(jq -r '.cardScanModelId // ""' config/app.json)" >> "$GITHUB_OUTPUT"

    # Sign-in and sync ship only when a Google client is configured (FR-ACCT-05).
    - id: api
      name: Deploy sync API
      if: steps.config.outputs.google_client_id != ''
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        EXECUTION_ROLE_ARN: ${{ inputs.execution-role-arn }}
        GOOGLE_CLIENT_ID: ${{ steps.config.outputs.google_client_id }}
        CARD_SCAN_MODEL_ID: ${{ steps.config.outputs.card_scan_model_id }}
        SHA: ${{ github.sha }}
      run: |
        account=$(aws sts get-caller-identity --query Account --output text)
        bucket="golf-sg-artifacts-$account-$AWS_REGION"
        key="$ENVIRONMENT/sync-$SHA.zip"
        aws s3 cp apps/sync/sync.zip "s3://$bucket/$key" --only-show-errors
        stack="golf-sg-api-$ENVIRONMENT"
        # A failed first create leaves ROLLBACK_COMPLETE, which can only be deleted, not updated.
        status=$(aws cloudformation describe-stacks --stack-name "$stack" \
          --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo NONE)
        if [[ "$status" == ROLLBACK_COMPLETE ]]; then
          echo "Removing $stack left in ROLLBACK_COMPLETE by a failed first deploy"
          aws cloudformation delete-stack --stack-name "$stack"
          aws cloudformation wait stack-delete-complete --stack-name "$stack"
        fi
        aws cloudformation deploy \
          --stack-name "$stack" \
          --template-file infra/cloudformation/api.yml \
          --role-arn "$EXECUTION_ROLE_ARN" \
          --capabilities CAPABILITY_NAMED_IAM \
          --no-fail-on-empty-changeset \
          --parameter-overrides \
            "Environment=$ENVIRONMENT" \
            "GoogleClientId=$GOOGLE_CLIENT_ID" \
            "CardScanModelId=$CARD_SCAN_MODEL_ID" \
            "CodeBucket=$bucket" \
            "CodeKey=$key" \
          --tags app=golf-sg "environment=$ENVIRONMENT"
        domain=$(aws cloudformation describe-stacks --stack-name "$stack" \
          --query "Stacks[0].Outputs[?OutputKey=='ApiDomain'].OutputValue" --output text)
        echo "domain=$domain" >> "$GITHUB_OUTPUT"

    - name: Show sync API stack failures
      if: failure() && steps.api.outcome == 'failure'
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        aws cloudformation describe-stack-events --stack-name "golf-sg-api-$ENVIRONMENT" \
          --max-items 40 --output table \
          --query "StackEvents[?contains(ResourceStatus, 'FAILED')].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" || true

    - id: web
      name: Deploy web stack
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        EXECUTION_ROLE_ARN: ${{ inputs.execution-role-arn }}
        DOMAIN_NAME: ${{ inputs.domain-name }}
        ACM_CERTIFICATE_ARN: ${{ inputs.acm-certificate-arn }}
        HOSTED_ZONE_ID: ${{ inputs.hosted-zone-id }}
        API_DOMAIN: ${{ steps.api.outputs.domain }}
      run: |
        aws cloudformation deploy \
          --stack-name "golf-sg-web-$ENVIRONMENT" \
          --template-file infra/cloudformation/web.yml \
          --role-arn "$EXECUTION_ROLE_ARN" \
          --no-fail-on-empty-changeset \
          --parameter-overrides \
            "Environment=$ENVIRONMENT" \
            "DomainName=$DOMAIN_NAME" \
            "AcmCertificateArn=$ACM_CERTIFICATE_ARN" \
            "HostedZoneId=$HOSTED_ZONE_ID" \
            "ApiDomain=$API_DOMAIN" \
          --tags app=golf-sg "environment=$ENVIRONMENT"

    - name: Show web stack failures
      if: failure() && steps.web.outcome == 'failure'
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        aws cloudformation describe-stack-events --stack-name "golf-sg-web-$ENVIRONMENT" \
          --max-items 40 --output table \
          --query "StackEvents[?contains(ResourceStatus, 'FAILED')].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" || true

    - id: stack
      name: Read stack outputs
      shell: bash
      env:
        STACK_NAME: golf-sg-web-${{ inputs.environment }}
      run: |
        out() {
          aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
        }
        {
          echo "bucket=$(out BucketName)"
          echo "distribution=$(out DistributionId)"
          echo "url=$(out SiteUrl)"
        } >> "$GITHUB_OUTPUT"

    # Hashed files are immutable and kept, so clients still on the previous build keep working.
    # Everything else (app shell, service worker, manifest, icons) must revalidate.
    - name: Upload site
      shell: bash
      working-directory: apps/web/dist
      env:
        BUCKET: ${{ steps.stack.outputs.bucket }}
      run: |
        aws s3 sync . "s3://$BUCKET" --exclude '*' --include 'assets/*' --include 'workbox-*.js' \
          --cache-control 'public, max-age=31536000, immutable'
        aws s3 sync . "s3://$BUCKET" --delete --exclude 'assets/*' --exclude 'workbox-*.js' \
          --cache-control 'no-cache'

    - name: Invalidate CDN
      shell: bash
      env:
        DISTRIBUTION: ${{ steps.stack.outputs.distribution }}
      run: |
        id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" \
          --paths '/*' --query Invalidation.Id --output text)
        aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$id"

    - name: Smoke test
      shell: bash
      env:
        URL: ${{ steps.stack.outputs.url }}
      run: |
        curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "$URL/" | grep -q '<title>Golf Strokes Gained</title>'
        curl -fsS "$URL/rounds/new" | grep -q 'id="root"'
        curl -fsSI "$URL/sw.js" | grep -qi '^content-security-policy:'

    - name: Smoke test sync API
      if: steps.api.outputs.domain != ''
      shell: bash
      env:
        URL: ${{ steps.stack.outputs.url }}
      run: |
        # Without a Google token the authorizer must refuse before the function runs.
        code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/sync")
        test "$code" = 401
