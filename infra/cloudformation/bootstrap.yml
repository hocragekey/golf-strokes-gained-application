AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Golf Strokes Gained - one-time account bootstrap. GitHub Actions OIDC trust, per-environment
  deploy roles, and the CloudFormation execution role that provisions the web stacks.

Parameters:
  GitHubOwner:
    Type: String
    Default: hocragekey
  GitHubRepo:
    Type: String
    Default: golf-strokes-gained-application
  GitHubOwnerId:
    Type: String
    Default: '2671490'
    AllowedPattern: '^[0-9]*$'
    Description: >-
      Numeric owner ID, for repos whose OIDC tokens use GitHub's immutable subject
      (repo:owner@id/repo@id). Leave both IDs blank for the classic repo:owner/repo subject.
  GitHubRepoId:
    Type: String
    Default: '1449035641'
    AllowedPattern: '^[0-9]*$'
    Description: Numeric repository ID (see GitHubOwnerId).
  AppName:
    Type: String
    Default: golf-sg
    AllowedPattern: '^[a-z][a-z0-9-]{1,20}$'
  ExistingOidcProviderArn:
    Type: String
    Default: ''
    Description: >-
      ARN of an existing token.actions.githubusercontent.com OIDC provider. An account can only
      have one; leave blank to create it.

Conditions:
  CreateOidcProvider: !Equals [!Ref ExistingOidcProviderArn, '']
  UseImmutableSubject:
    !Not [!Or [!Equals [!Ref GitHubOwnerId, ''], !Equals [!Ref GitHubRepoId, '']]]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  # Lambda bundles, uploaded by the deploy roles under <env>/ and read by CloudFormation.
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: Build artifacts only; access logging is not needed.
          - id: CKV_AWS_144
            comment: Artifacts are reproducible from git; no cross-region replication.
          - id: CKV_AWS_145
            comment: SSE-S3 is sufficient for build artifacts.
    Properties:
      BucketName: !Sub ${AppName}-artifacts-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-bundles
            Status: Enabled
            ExpirationInDays: 180
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub ${ArtifactBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # Assumed by CloudFormation itself; each deploy role can only pass its own environment's role,
  # so a dev change set cannot touch the prod bucket.
  DevCfnExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: Only CloudFormation can assume it; S3 is scoped to this environment's bucket and CloudFront to this account.
    Properties:
      RoleName: !Sub ${AppName}-cfn-execution-dev
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Ref CfnSharedPolicy
      Policies:
        - PolicyName: site-bucket
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SiteBucket
                Effect: Allow
                Action: s3:*
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${AppName}-web-dev-*
        - PolicyName: sync-api
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Table
                Effect: Allow
                Action: dynamodb:*
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AppName}-api-dev
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AppName}-api-dev/*
              - Sid: Function
                Effect: Allow
                Action: lambda:*
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AppName}-api-dev*
              - Sid: FunctionRole
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:TagRole
                  - iam:UntagRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-api-dev-*
              - Sid: PassFunctionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-api-dev-*
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Sid: LogGroups
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:ListTagsForResource
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppName}-api-dev*
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/${AppName}-api-dev*
              - Sid: Code
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucket}/dev/*

  ProdCfnExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: Only CloudFormation can assume it; S3 is scoped to this environment's bucket and CloudFront to this account.
    Properties:
      RoleName: !Sub ${AppName}-cfn-execution-prod
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Ref CfnSharedPolicy
      Policies:
        - PolicyName: site-bucket
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SiteBucket
                Effect: Allow
                Action: s3:*
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${AppName}-web-prod-*
        - PolicyName: sync-api
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Table
                Effect: Allow
                Action: dynamodb:*
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AppName}-api-prod
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AppName}-api-prod/*
              - Sid: Function
                Effect: Allow
                Action: lambda:*
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AppName}-api-prod*
              - Sid: FunctionRole
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:TagRole
                  - iam:UntagRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-api-prod-*
              - Sid: PassFunctionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-api-prod-*
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Sid: LogGroups
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:ListTagsForResource
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppName}-api-prod*
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/${AppName}-api-prod*
              - Sid: Code
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucket}/prod/*

  CfnSharedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${AppName}-cfn-execution-shared
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFront
            Effect: Allow
            Action:
              - cloudfront:*Distribution*
              - cloudfront:*OriginAccessControl*
              - cloudfront:*ResponseHeadersPolicy*
              - cloudfront:*Function*
              - cloudfront:TagResource
              - cloudfront:UntagResource
              - cloudfront:ListTagsForResource
            Resource:
              - !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*
              - !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:origin-access-control/*
              - !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:response-headers-policy/*
              - !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:function/*
          - Sid: Dns
            Effect: Allow
            Action:
              - route53:ChangeResourceRecordSets
              - route53:GetChange
              - route53:GetHostedZone
              - route53:ListResourceRecordSets
            Resource:
              - !Sub arn:${AWS::Partition}:route53:::hostedzone/*
              - !Sub arn:${AWS::Partition}:route53:::change/*
          - Sid: Certificates
            Effect: Allow
            Action:
              - acm:DescribeCertificate
              - acm:ListCertificates
            Resource: '*'
          - Sid: HttpApis
            Effect: Allow
            Action:
              - apigateway:GET
              - apigateway:POST
              - apigateway:PUT
              - apigateway:PATCH
              - apigateway:DELETE
            Resource:
              - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis
              - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/*
              - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/tags/*
          - Sid: AccessLogDelivery
            Effect: Allow
            Action:
              - logs:CreateLogDelivery
              - logs:GetLogDelivery
              - logs:UpdateLogDelivery
              - logs:DeleteLogDelivery
              - logs:ListLogDeliveries
              - logs:PutResourcePolicy
              - logs:DescribeResourcePolicies
              - logs:DescribeLogGroups
            Resource: '*'

  DevDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-deploy-dev
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument: !Sub
        - |
          {
            "Version": "2012-10-17",
            "Statement": [{
              "Effect": "Allow",
              "Principal": { "Federated": "${Provider}" },
              "Action": "sts:AssumeRoleWithWebIdentity",
              "Condition": {
                "StringEquals": {
                  "token.actions.githubusercontent.com:aud": "sts.amazonaws.com",
                  "token.actions.githubusercontent.com:sub": "${Subject}:environment:dev"
                }
              }
            }]
          }
        - Provider: !If [CreateOidcProvider, !Ref GitHubOidcProvider, !Ref ExistingOidcProviderArn]
          Subject: !If
            - UseImmutableSubject
            - !Sub repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}
            - !Sub repo:${GitHubOwner}/${GitHubRepo}
      ManagedPolicyArns:
        - !Ref DevDeployPolicy

  ProdDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-deploy-prod
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument: !Sub
        - |
          {
            "Version": "2012-10-17",
            "Statement": [{
              "Effect": "Allow",
              "Principal": { "Federated": "${Provider}" },
              "Action": "sts:AssumeRoleWithWebIdentity",
              "Condition": {
                "StringEquals": {
                  "token.actions.githubusercontent.com:aud": "sts.amazonaws.com",
                  "token.actions.githubusercontent.com:sub": "${Subject}:environment:prod"
                }
              }
            }]
          }
        - Provider: !If [CreateOidcProvider, !Ref GitHubOidcProvider, !Ref ExistingOidcProviderArn]
          Subject: !If
            - UseImmutableSubject
            - !Sub repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}
            - !Sub repo:${GitHubOwner}/${GitHubRepo}
      ManagedPolicyArns:
        - !Ref ProdDeployPolicy

  DevDeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${AppName}-deploy-dev
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: WebStack
            Effect: Allow
            Action:
              - cloudformation:CreateChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:GetTemplateSummary
            Resource:
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppName}-web-dev/*
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppName}-api-dev/*
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/*
          - Sid: TemplateValidation
            Effect: Allow
            Action: cloudformation:ValidateTemplate
            Resource: '*'
          - Sid: PassExecutionRole
            Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt DevCfnExecutionRole.Arn
            Condition:
              StringEquals:
                iam:PassedToService: cloudformation.amazonaws.com
          - Sid: UploadSite
            Effect: Allow
            Action:
              - s3:ListBucket
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::${AppName}-web-dev-*
              - !Sub arn:${AWS::Partition}:s3:::${AppName}-web-dev-*/*
          - Sid: UploadFunctionCode
            Effect: Allow
            Action: s3:PutObject
            Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucket}/dev/*
          - Sid: Invalidate
            Effect: Allow
            Action:
              - cloudfront:CreateInvalidation
              - cloudfront:GetInvalidation
            Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*

  ProdDeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${AppName}-deploy-prod
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: WebStack
            Effect: Allow
            Action:
              - cloudformation:CreateChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:GetTemplateSummary
            Resource:
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppName}-web-prod/*
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppName}-api-prod/*
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/*
          - Sid: TemplateValidation
            Effect: Allow
            Action: cloudformation:ValidateTemplate
            Resource: '*'
          - Sid: PassExecutionRole
            Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt ProdCfnExecutionRole.Arn
            Condition:
              StringEquals:
                iam:PassedToService: cloudformation.amazonaws.com
          - Sid: UploadSite
            Effect: Allow
            Action:
              - s3:ListBucket
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::${AppName}-web-prod-*
              - !Sub arn:${AWS::Partition}:s3:::${AppName}-web-prod-*/*
          - Sid: UploadFunctionCode
            Effect: Allow
            Action: s3:PutObject
            Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucket}/prod/*
          - Sid: Invalidate
            Effect: Allow
            Action:
              - cloudfront:CreateInvalidation
              - cloudfront:GetInvalidation
            Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*

Outputs:
  DevCfnExecutionRoleArn:
    Description: GitHub environment variable AWS_CFN_EXECUTION_ROLE_ARN for the dev environment
    Value: !GetAtt DevCfnExecutionRole.Arn
  ProdCfnExecutionRoleArn:
    Description: GitHub environment variable AWS_CFN_EXECUTION_ROLE_ARN for the prod environment
    Value: !GetAtt ProdCfnExecutionRole.Arn
  DevDeployRoleArn:
    Description: GitHub environment variable AWS_DEPLOY_ROLE_ARN for the dev environment
    Value: !GetAtt DevDeployRole.Arn
  ProdDeployRoleArn:
    Description: GitHub environment variable AWS_DEPLOY_ROLE_ARN for the prod environment
    Value: !GetAtt ProdDeployRole.Arn
  ArtifactBucketName:
    Description: Bucket for Lambda bundles (deploy workflow computes the same name)
    Value: !Ref ArtifactBucket
