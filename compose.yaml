services:
  app:
    build: .
    image: ghcr.io/hocragekey/golf-strokes-gained-application:local
    init: true
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      LOG_LEVEL: info
    volumes:
      - golf-sg-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  golf-sg-data:
